# Publishes the site to GitHub Pages (https://<user>.github.io/<repo>/) for testing.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# GitHub Pages can't send the cross-origin isolation headers the AI tools need, so the
# service worker adds them (public/sw-isolation.js; see README).
# The site is only deployed when the unit tests and the browser tests pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  # Also runnable by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time; a newer push replaces one still waiting. A run in progress is never
# cancelled (as in GitHub's own Pages workflow): a deployment cut off halfway can stay
# "in progress" on GitHub's side and make the next one fail.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          # The site lives in a subfolder named after the repository.
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  # Browser tests (desktop and phone) against the e2e build, alongside the site build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium, plus the system libraries and fonts it needs on Linux.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Traces of the failed tests; open one with `npx playwright show-trace <trace.zip>`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  # The same tests in Firefox and WebKit (Safari's engine). Not required for deploying
  # yet: a failure shows on this job, but the run still passes and the deploy goes ahead.
  e2e-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:browsers
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-browsers-results
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
