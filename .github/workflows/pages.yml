# Publishes the site to GitHub Pages (https://<user>.github.io/<repo>/) for testing.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# GitHub Pages can't send cross-origin isolation headers, so the AI models' WASM
# fallback runs single-threaded there; Netlify (see README) runs at full speed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  # Also runnable by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          # The site lives in a subfolder named after the repository.
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
